<!doctype html>
<html lang="en">
  <head>
    <link href="style.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="main.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body class="flex flex-col justify-center text-center">
    <h1>Users</h1>
    <input type="text" placeholder="Search" />
    <button class="border" onclick="renderUsers()">Load Cards</button>
    <div
      id="user-container"
      class="flex flex-row flex-wrap gap-5 justify-center"
    ></div>
    <div class="flex flex-row justify-center p-16 gap-5 bg-gray-100">
      <button id="backButton" onclick="changePageData(-1)" class="border w-4">1</button>
      <p id="currentPageIndex" class="">1</p>
      <button id="forwardButton" onclick="changePageData(1)" class="border w-4">2</button>
    </div>
  </body>
</html>
